# DEMO/PREVIEW ONLY. Render Free web services sleep after inactivity and the
# Free Postgres database expires after 30 days. Do not put real student records
# or real complaints on this preview. Use a paid, backed-up database for official use.
databases:
  - name: gdcz-portal-preview-db
    plan: free
    databaseName: gdcz_portal
    user: gdcz_portal

services:
  - type: web
    name: gdc-ziam-portal-preview
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: gdcz-portal-preview-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
